  bind:
    image: cytopia/bind:alpine-0.35
    container_name: ${COMPOSE_PROJECT_NAME}_bind
    hostname: bind
    restart: unless-stopped
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
    environment:
      - DNS_A=${DNS_A}
      - DNS_FORWARDER=${DNS_FORWARDER}
    networks:
      dlbridge:
        ipv4_address: ${DL_BIND_IPv4}
    deploy:
      replicas: 0
