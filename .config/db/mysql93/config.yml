  mysql93:
    image: degobbis/${MYSQL93_HOST_NAME}:latest
    container_name: ${COMPOSE_PROJECT_NAME}_${MYSQL93_HOST_NAME}
    restart: unless-stopped
    volumes:
      - ${DOCKER_LAMP_BASEDIR}/.config/db/mysql93/my.cnf:/etc/mysql/conf.d/xxx-docker-lamp.cnf
      - ${MYSQL93_DATA_VOLUME}:/var/lib/mysql
      - ${APP_BASEDIR:-${DOCKER_LAMP_BASEDIR}/data}/${MYSQL93_DUMP_DIR}:/docker-entrypoint-initdb.d
    environment:
      TZ: ${MY_TZ:-UTC}
      LANG: ${MY_LOCALES:-en_GB.UTF-8}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
      APP_USER_ID: ${APP_USER_ID:-1000}
      APP_GROUP_ID: ${APP_GROUP_ID:-1000}
      INIT_DB_BY_SCRIPT: 1
    ports:
      - "${MYSQL93_PORT:-3310}:3306"
    depends_on:
      - bind-internal
    networks:
      dlbridge:
        ipv4_address: ${DL_MYSQL93_IPv4}
        aliases: ${MYSQL93_ALIASES}
    dns:
      - ${DL_BIND_INTERNAL_IPv4:-}
