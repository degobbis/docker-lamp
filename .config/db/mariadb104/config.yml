  mariadb104:
    image: degobbis/mariadb104:latest
    container_name: ${COMPOSE_PROJECT_NAME}_mariadb104
    hostname: ${MARIADB104_HOST_NAME}
    restart: unless-stopped
    volumes:
      - ${MARIADB104_DATA_VOLUME}:/var/lib/mysql
      - ${APP_BASEDIR:-${DOCKER_LAMP_BASEDIR}/data}/${MARIADB104_DUMP_DIR}:/docker-entrypoint-initdb.d
    environment:
      TZ: ${MY_TZ:-UTC}
      LC_ALL: ${MY_LOCALES:-en_GB.UTF-8}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
      APP_USER_ID: ${APP_USER_ID:-1000}
      APP_GROUP_ID: ${APP_GROUP_ID:-1000}
      INIT_DB_BY_SCRIPT: 1
    ports:
      - "${MARIADB104_PORT:-3306}:3306"
    depends_on:
      - bind-internal
    networks:
      dlbridge:
        ipv4_address: ${DL_MARIADB104_IPv4}
    dns:
      - ${DL_BIND_INTERNAL_IPv4:-}
