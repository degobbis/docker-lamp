  mysql80:
    image: degobbis/${MYSQL80_HOST_NAME}:latest
    container_name: ${COMPOSE_PROJECT_NAME}_${MYSQL80_HOST_NAME}
    restart: unless-stopped
    volumes:
      - ${DOCKER_LAMP_BASEDIR}/.config/db/mysql80/my.cnf:/etc/mysql/conf.d/xxx-docker-lamp.cnf
      - ${MYSQL80_DATA_VOLUME}:/var/lib/mysql
      - ${APP_BASEDIR:-${DOCKER_LAMP_BASEDIR}/data}/${MYSQL80_DUMP_DIR}:/docker-entrypoint-initdb.d
    environment:
      TZ: ${MY_TZ:-UTC}
      LANG: ${MY_LOCALES:-en_GB.UTF-8}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root}
      APP_USER_ID: ${APP_USER_ID:-1000}
      APP_GROUP_ID: ${APP_GROUP_ID:-1000}
      INIT_DB_BY_SCRIPT: 1
    ports:
      - "${MYSQL80_PORT:-3307}:3306"
    depends_on:
      - bind-internal
    networks:
      dlbridge:
        ipv4_address: ${DL_MYSQL80_IPv4}
        aliases: ${MYSQL80_ALIASES}
    dns:
      - ${DL_BIND_INTERNAL_IPv4:-}
